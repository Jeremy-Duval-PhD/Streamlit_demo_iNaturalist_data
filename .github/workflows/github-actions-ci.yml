name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Installer les dépendances système pour python3-venv
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-venv python3-pip

    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    # Cache pip pour accélérer les builds
    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Créer et activer un virtualenv isolé, installer dépendances
    - name: Create and activate virtualenv
      run: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Lint ciblé sur ton code et les tests
    - name: Lint Python files
      run: |
        source .venv/bin/activate
        flake8 app.py pages tests --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__
        flake8 app.py pages tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,__pycache__

    # Exécuter les tests avec pytest
    - name: Run tests with pytest
      run: |
        source .venv/bin/activate
        pytest

