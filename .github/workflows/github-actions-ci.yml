# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies in isolated virtualenv
      run: |
        python -m venv .venv
        # Ajoute le venv au PATH pour que toutes les étapes utilisent le même
        echo "${{ github.workspace }}/.venv/bin" >> $GITHUB_PATH
        pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint Python files
      run: |
        flake8 app.py pages tests --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__
        flake8 app.py pages tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,__pycache__

    - name: Run tests with pytest
      run: |
        pytest

